name: Update Function Headlinks in README

on:
  push:
    branches:
      - main
    paths:
      - '**.js'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Baixa o histórico completo para garantir a detecção correta dos diffs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Babel Dependencies
        run: npm install @babel/parser @babel/traverse

      - name: Get modified JS files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.js

      - name: Run Headlink Parser Script
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node libs/update-readme-links.js ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: atualiza headlinks das funções no README.md [skip ci]"
            git push
          else
            echo "Nenhuma alteração de link necessária no README.md."
          fi